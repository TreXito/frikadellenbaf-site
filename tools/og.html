<!DOCTYPE html>
<!-- Source for assets/og.png (1200x630). Render: serve the repo root, open /tools/og.html at 1200x630, screenshot. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#040705;font-family:Geist,sans-serif;color:#f2f7f3;-webkit-font-smoothing:antialiased}
.a{position:absolute;border-radius:50%;width:900px;height:900px}
.a1{left:-380px;top:-480px;background:radial-gradient(closest-side,rgba(47,211,106,.5),transparent 72%)}
.a2{right:-380px;top:-220px;background:radial-gradient(closest-side,rgba(43,107,255,.42),transparent 72%)}
.a3{left:240px;bottom:-660px;background:radial-gradient(closest-side,rgba(15,179,154,.38),transparent 72%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 20% 0%,#000,transparent 75%)}
.copy{position:absolute;left:80px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:520px}
.ic{width:92px;height:92px;border-radius:21px;display:grid;place-items:center;background:linear-gradient(160deg,#5bea8e,#16a34f 55%,#0b6e35);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -4px 10px rgba(0,0,0,.22),0 24px 50px -18px rgba(22,163,79,.85)}
.ic svg{width:48px;height:48px;fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
h1{margin-top:34px;font-size:96px;font-weight:750;letter-spacing:-.062em;line-height:.9;background:linear-gradient(180deg,#fff 35%,rgba(255,255,255,.7));-webkit-background-clip:text;color:transparent}
h1 span{background:linear-gradient(180deg,#a6ffc6,#34d36a 60%,#1aa553);-webkit-background-clip:text;color:transparent}
.sub{margin-top:24px;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.18}
.sub span{color:rgba(226,240,231,.46)}
.url{margin-top:36px;display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;font:500 20px/1 'Geist Mono';color:#fff;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.08)}
.url i{width:10px;height:10px;border-radius:50%;background:#34d36a;box-shadow:0 0 12px #34d36a}
.shot{position:absolute;left:640px;top:92px;width:760px;padding:10px;border-radius:30px;
 background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
 box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.08),0 50px 90px -30px rgba(0,0,0,.85);
 transform:perspective(1400px) rotateY(-14deg) rotateX(4deg);transform-origin:0 50%}
.shot img{display:block;width:100%;border-radius:21px}
</style></head><body>
<div class="a a1"></div><div class="a a2"></div><div class="a a3"></div><div class="grid"></div>
<div class="shot"><img src="../assets/web-panel1.webp" alt=""></div>
<div class="copy">
  <div class="ic"><svg viewBox="0 0 24 24"><path d="M5 7l5 5-5 5"/><path d="M12.5 17H19"/></svg></div>
  <h1>Frikadellen <span>BAF</span></h1>
  <div class="sub">Auction House &amp; Bazaar flipper.<br><span>Hypixel SkyBlock, built in Rust.</span></div>
  <div class="url"><i></i>auctionflipper.bz</div>
</div>
</body></html>
